# Veröffentlicht die Projekt-Homepage + das Demo-Dashboard über GitHub Pages.
#   /        -> site/index.html (Landing-Page, self-contained)
#   /demo/   -> frischer statischer Snapshot mit Beispieldaten (--sample)
#   /assets/ -> Screenshots aus docs/
# Keine echten Systeme, keine Anmeldung, kein Server.
# Ergebnis:  https://marcobockelbrink.github.io/vmware/
name: Homepage + Live-Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - aria_kapa.py
      - kapa/**
      - frontend/**
      - site/**
      - docs/screenshot*.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seite zusammenstellen (Homepage + Demo + Assets)
        run: |
          mkdir -p _site/demo _site/assets
          cp site/index.html _site/index.html
          cp docs/screenshot*.png _site/assets/
          python3 aria_kapa.py --sample --output _site/demo/index.html
          echo "Demo erzeugt: $(wc -c < _site/demo/index.html) Bytes"
          # Alter Demo-Deeplink bleibt gültig: / zeigte früher direkt die Demo.
          ls -la _site _site/demo _site/assets

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
