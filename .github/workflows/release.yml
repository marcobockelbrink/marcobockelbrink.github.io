# Attaches signed, verifiable artifacts to a GitHub release: a reproducible
# source bundle (the deployable set: aria_kapa.py + kapa/ + frontend/), a
# SHA256SUMS file, and a keyless cosign signature (Sigstore — no secret to
# manage, uses the workflow's OIDC identity).
#
# Runs automatically when a release is published, and can be triggered
# manually to (re)sign an existing tag (e.g. to backfill an older release).
#
# Verify a downloaded release:
#   cosign verify-blob \
#     --bundle SHA256SUMS.cosign.bundle \
#     --certificate-identity-regexp '^https://github.com/marcobockelbrink/vmware/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     SHA256SUMS
#   sha256sum -c SHA256SUMS
name: Signed release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)sign, e.g. v3.7.0"
        required: true

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    permissions:
      contents: write      # upload release assets
      id-token: write      # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build reproducible source bundle + checksums
        run: |
          set -euo pipefail
          BUNDLE="kapa-dashboard-${TAG}.tar.gz"
          # Deployable set only; deterministic tar so the digest is reproducible.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
              -czf "$BUNDLE" aria_kapa.py kapa frontend
          sha256sum "$BUNDLE" > SHA256SUMS
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign the checksums (keyless / Sigstore)
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      - name: Upload signed artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$BUNDLE" SHA256SUMS SHA256SUMS.cosign.bundle --clobber
