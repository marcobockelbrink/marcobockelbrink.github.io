# Baut das Container-Image und veröffentlicht es als GitHub Package (GHCR).
# Läuft automatisch bei jedem Release-Tag (v*); manueller Start über
# "Run workflow" ist möglich (optional mit Versionsnummer für den Image-Tag).
#
# Ergebnis:  ghcr.io/marcobockelbrink/kapa-dashboard:latest  und  :<version>
name: Docker-Image (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Zusätzlicher Versions-Tag (z. B. 1.30) – leer = nur latest"
        required: false
        default: ""

# Standard: nur lesen — die Schreibrechte bekommt gezielt der Build-Job
# (Scorecard-Best-Practice: Write-Permissions auf Job-, nicht Workflow-Ebene).
permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # für die Provenance-Signatur (Sigstore, keyless)
      attestations: write    # Attestation im Repo hinterlegen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU + Buildx für Multi-Arch (RHEL-Hosts amd64, Dev-Macs arm64)
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kapa-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Kryptografischer Herkunftsnachweis (SLSA-Provenance): belegt überprüfbar,
      # dass das Image aus genau diesem Commit + Workflow gebaut wurde. Landet
      # signiert (Sigstore, keyless) an der Image-Registry.
      - name: Build-Provenance attestieren
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kapa-dashboard
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
