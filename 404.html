<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicht gefunden — Marco Bockelbrink</title>
<meta name="color-scheme" content="light dark">
<style>
  /* Leitete früher auf /vmware/ weiter -- eine Adresse, die es nicht gibt.
     Eine 404, die auf eine 404 zeigt, ist schlechter als gar keine. */
  :root { --grund:#f4f6f7; --tinte:#161e22; --leise:#5a686f; --akzent:#16523a; }
  @media (prefers-color-scheme: dark) {
    :root { --grund:#0f1417; --tinte:#e6ecef; --leise:#94a4ac; --akzent:#6cc79b; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--grund); color:var(--tinte); padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.55; }
  main { max-width:44ch; }
  h1 { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-weight:600; font-size:1.4rem; margin:0 0 10px; }
  p { margin:0 0 18px; color:var(--leise); }
  a { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-weight:600; color:var(--akzent); text-decoration:none;
    border-bottom:2px solid currentColor; padding-bottom:2px; }
  a:focus-visible { outline:3px solid var(--akzent); outline-offset:4px; }
</style>
</head>
<body>
<main>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht war der Link alt, vielleicht ein Tippfehler.</p>
  <a href="/">Zur Übersicht →</a>
</main>
</body>
</html>
